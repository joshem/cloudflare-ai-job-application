<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat (Go on Cloudflare Workers)</title>
    <style>
        :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --user:#2563eb; --user-fg:#fff; --bot:#f1f1f1; --border:#ddd; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#161616; --fg:#eee; --muted:#999; --user:#3b82f6; --user-fg:#fff; --bot:#262626; --border:#333; }
        }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif;
            display:flex; flex-direction:column; height:100vh; }
        header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        header h1 { font-size:1rem; margin:0; }
        button { font:inherit; cursor:pointer; }
        #reset { background:none; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:4px 10px; }
        #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:720px; width:100%; margin:0 auto; }
        .msg { padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
        .user { align-self:flex-end; background:var(--user); color:var(--user-fg); }
        .bot { align-self:flex-start; background:var(--bot); }
        .error { color:#dc2626; }
        form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); max-width:720px; width:100%; margin:0 auto; }
        input { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
        #send { background:var(--user); color:var(--user-fg); border:none; border-radius:8px; padding:0 18px; }
        #send:disabled { opacity:.5; cursor:default; }
    </style>
</head>
<body>
<header>
    <h1>AI Chat</h1>
    <button id="reset" type="button">New chat</button>
</header>
<div id="log" aria-live="polite"></div>
<form id="form">
    <input id="input" autocomplete="off" placeholder="Type a message..." required>
    <button id="send" type="submit">Send</button>
</form>

<script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    // Session ID persists in localStorage so history survives reloads.
    // Wrapped in try/catch because storage can be unavailable (e.g. private mode).
    function getSessionId() {
        try {
            let id = localStorage.getItem("sessionId");
            if (!id) { id = crypto.randomUUID(); localStorage.setItem("sessionId", id); }
            return id;
        } catch { return crypto.randomUUID(); }
    }
    let sessionId = getSessionId();

    function addMessage(text, cls) {
        const el = document.createElement("div");
        el.className = "msg " + cls;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        addMessage(message, "user");
        const pending = addMessage("Thinking...", "bot");
        send.disabled = true;

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sessionId, message }),
            });
            if (!res.ok) throw new Error((await res.text()) || res.statusText);
            const data = await res.json();
            pending.textContent = data.reply || "(empty reply)";
        } catch (err) {
            pending.textContent = "Error: " + err.message;
            pending.classList.add("error");
        } finally {
            send.disabled = false;
            input.focus();
        }
    });

    document.getElementById("reset").addEventListener("click", () => {
        sessionId = crypto.randomUUID();
        try { localStorage.setItem("sessionId", sessionId); } catch {}
        log.innerHTML = "";
        input.focus();
    });
</script>
</body>
</html>
